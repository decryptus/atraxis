name: Promote Atraxis 1.0.8 to PyPI
on:
  pull_request:
    paths:
      - .github/workflows/publish-pypi.yml
      - scripts/promote-pypi.py
  push:
    branches: [release/publish-pypi-1.0.8]
    paths: [.github/workflows/publish-pypi.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pypi-review-{0}', github.run_id) || 'atraxis-pypi' }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.stage.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source tag and exact GitHub release files
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            test "$GITHUB_SHA" = "$(gh api repos/decryptus/atraxis/branches/main --jq .commit.sha)"
          fi
          test "$(gh api repos/decryptus/atraxis/git/ref/tags/v1.0.8 --jq .object.sha)" = f99d099019b01ebb27ef1023d9c0c347c198d980
          gh release download v1.0.8 -D release-assets
          python scripts/promote-pypi.py --stage
          echo "pending=$(find pypi-upload -type f | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Install and check the release wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/verified"
          "$RUNNER_TEMP/verified/bin/pip" install release-assets/*.whl
          cd "$RUNNER_TEMP"
          verified/bin/pip check
          verified/bin/atraxis --help
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.stage.outputs.pending != '0'
        with:
          name: verified-upload
          path: pypi-upload/
          retention-days: 2
          if-no-files-found: error
  publish:
    needs: prepare
    if: needs.prepare.outputs.pending != '0' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/publish-pypi-1.0.8') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-upload
          path: upload
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: upload/
  verify:
    needs: [prepare, publish]
    if: always() && github.event_name != 'pull_request' && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.pending == '0')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare both registry downloads and install the indexed wheel
        run: |
          set -euo pipefail
          for delay in 0 10 20 40 60; do
            sleep "$delay"
            python scripts/promote-pypi.py --verify && break
          done
          python scripts/promote-pypi.py --verify
          python -m venv "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP"
          for delay in 0 10 20 40; do
            sleep "$delay"
            registry/bin/pip install --no-cache-dir --index-url https://pypi.org/simple --only-binary atraxis 'atraxis==1.0.8' && break
          done
          registry/bin/pip check
          registry/bin/python -c "from importlib.metadata import version; assert version('atraxis') == '1.0.8'"
          registry/bin/atraxis --help
  check-registry-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e51fa15fa9c9348d8d253ac300ba90493ecf97f
          persist-credentials: false
      - name: Exercise the exact Docker Hub image on a fresh runner
        run: |
          set -euo pipefail
          digest=sha256:f75291bd5666e285a35550ad1fa39a4c2ee5b3916c877742f32fbb7633ebba4e
          image=decryptus/atraxis:1.0.7
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | jq -e --arg ref "decryptus/atraxis@$digest" 'index($ref) != null'
          docker tag "$image" atraxis:test
          python deploy/docker/check-image.py
