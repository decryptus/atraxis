name: operator Compose acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2 PyYAML==6.0.3
      - uses: actions/checkout@v4
        with:
          repository: decryptus/atropos
          ref: 58fe1241267eca99f78229b44f3f2599229594a5
          path: .acceptance/engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/auton
          ref: 7f57348b144fa62400bad31160d4b4ad5c00f53c
          path: .auton-source
          persist-credentials: false
      - name: Verify public inputs and prepare the bounded Auton fixture
        run: python scripts/chain/prepare-public-inputs.py
      - name: Collect operator Compose acceptance
        run: python scripts/check-test-collection.py --runner unittest compose_tests
      - name: Build and verify worker profiles, recreation and cold restoration
        shell: bash
        run: sudo "$(command -v python)" -m unittest discover -s compose_tests -v 2>&1 | tee acceptance-artifacts/compose.log
      - name: Verify installed packages match both source candidates
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          source = Path('.acceptance/engine')
          expected = {str(p.relative_to(source)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted((source / 'atropos').rglob('*.py'))}
          expected.update({str(p.relative_to(source / 'client')): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted((source / 'client/atropos_client').rglob('*.py'))})
          web_files = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path('atraxis').rglob('*.py'))}
          web_files.update({name: digest for name, digest in expected.items() if name.startswith('atropos_client/')})
          verifier = '''import hashlib, importlib.util, json
          from importlib.metadata import version
          from pathlib import Path
          project, release = json.loads(%r)
          assert version(project) == release
          assert version('sonicprobe') == '0.3.62'
          for name, digest in json.loads(%r).items():
              package, relative = name.split('/', 1)
              spec = importlib.util.find_spec(package)
              path = Path(spec.origin).parent / relative
              assert str(path).startswith('/usr/local/lib/python3.12/site-packages/')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          print('Installed package bytes verified:', project)
          '''
          images = {}
          for image, project, release, files in (
                  ('atraxis-install-engine:local', 'atraxis-atropos', '0.1.0a21', expected),
                  ('atraxis-install-web:local', 'atraxis', '0.0.1.dev0', web_files)):
              subprocess.run(['docker', 'run', '--rm', '-i', '--network', 'none', '--read-only',
                  '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--memory', '512m',
                  '--cpus', '2', '--pids-limit', '128', '--entrypoint', 'python', image, '-'],
                  input=verifier % (json.dumps([project, release]), json.dumps(files)),
                  text=True, check=True, timeout=60)
              images[image] = dict(files=files, image=subprocess.check_output(
                  ['docker', 'image', 'inspect', '--format', '{{.Id}}', image], text=True).strip())
          Path('acceptance-artifacts/installed-packages.json').write_text(json.dumps(images, indent=2) + '\n')
          PY
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-compose-evidence
          path: acceptance-artifacts/*
          retention-days: 30
          if-no-files-found: error
