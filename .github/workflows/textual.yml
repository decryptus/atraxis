name: Textual terminal tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  # Only pull request runs share a group, so pushes are never queued or cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  textual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[textual,installer]' resvg-py
      - run: python scripts/check-test-collection.py --runner unittest textual_tests
      - run: python -m unittest discover -s textual_tests -v
      - run: python scripts/capture_textual.py --output /tmp/textual-captures --png
      - uses: actions/upload-artifact@v4
        with:
          name: textual-captures
          path: /tmp/textual-captures
