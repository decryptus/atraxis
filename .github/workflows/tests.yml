name: Core tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # Only pull request runs share a group, so pushes are never queued or cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.3
      - run: ruff check --select E701,E702,E703 atraxis
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[installer]"
      - run: python scripts/check-test-collection.py --runner unittest tests
      - run: python -m unittest discover -s tests -v
  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build private test image (no push)
        run: docker build --tag atraxis-acceptance:ci .
      - name: Validate isolated Docker runtime
        run: python3 scripts/docker-acceptance.py --image atraxis-acceptance:ci
  docker-network-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2
      - name: Build private application and test-only nginx images (no push)
        run: |
          docker build --tag atraxis-acceptance:ci .
          docker build --tag atraxis-ingress:ci --file scripts/network/Dockerfile .
      - name: Validate verified TLS across isolated networks and inject failures
        run: python scripts/docker-network-acceptance.py --image atraxis-acceptance:ci --ingress-image atraxis-ingress:ci
