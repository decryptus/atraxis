name: Publish reviewed stable release
on:
  # Creating or moving release/publish-X.Y.Z to the reviewed merge commit on main
  # or stable/X.Y.Z is the explicit publication action for version X.Y.Z.
  push:
    branches: ['release/publish-*']
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Full reviewed PR head SHA (same tree as the branch head, all PR workflows passed)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-atraxis-stable
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stable/') || startsWith(github.ref, 'refs/heads/release/publish-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the release version
        id: version
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Stable version required: ' + version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Verify exact source and successful required PR workflows
        id: qualification
        uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const version = process.env.VERSION;
            const ref = context.ref.replace('refs/heads/', '');
            if (ref.startsWith('release/publish-') && ref !== 'release/publish-' + version)
              throw new Error('Publication branch does not name the release version');
            if (ref.startsWith('stable/') && ref !== 'stable/' + version)
              throw new Error('Stable branch does not name the release version');
            // The release commit is the current head of main or of stable/X.Y.Z.
            const bases = ref.startsWith('stable/') ? [ref] : ['main', 'stable/' + version];
            let base = null;
            for (const branch of bases) {
              try {
                const head = (await github.rest.repos.getBranch({...repo, branch})).data;
                if (head.commit.sha === context.sha) { base = branch; break; }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!base) throw new Error('Release must be the current head of main or stable/' + version);
            let tested = process.env.TESTED_SHA;
            if (context.eventName === 'push') {
              // Creating/updating this dedicated branch is the explicit publication action.
              // Ordinary main pushes and PRs never publish.
              const associated = (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...repo, commit_sha: context.sha, per_page: 100})).data;
              const merged = associated.filter(p => p.merged_at && p.merge_commit_sha === context.sha && p.base.ref === base);
              if (merged.length !== 1) throw new Error('One reviewed merged PR is required');
              tested = merged[0].head.sha;
            }
            if (!/^[0-9a-f]{40}$/.test(tested)) throw new Error('Invalid tested SHA');
            const source = (await github.rest.git.getCommit({...repo, commit_sha: tested})).data;
            const current = (await github.rest.git.getCommit({...repo, commit_sha: context.sha})).data;
            if (source.tree.sha !== current.tree.sha) throw new Error('Untested release tree');
            const required = ['tests.yml', 'package.yml', 'textual.yml', 'web.yml',
              'prometheus.yml', 'chain.yml', 'browser-engine.yml', 'operator-compose.yml', 'operator-registry.yml',
              'guided-deployment.yml', 'dockerhub.yml'];
            const runs = {};
            for (const workflow_id of required) {
              const result = await github.rest.actions.listWorkflowRuns({...repo, workflow_id,
                head_sha: tested, event: 'pull_request', per_page: 10});
              const latest = result.data.workflow_runs.sort((a,b) => b.id - a.id)[0];
              if (!latest || latest.head_sha !== tested || latest.status !== 'completed' ||
                  latest.conclusion !== 'success') throw new Error(`Required workflow not passed: ${workflow_id}`);
              runs[workflow_id] = {id: latest.id, url: latest.html_url, attempt: latest.run_attempt};
            }
            fs.writeFileSync('stable-ci.json', JSON.stringify({schema: 1,
              tested_commit: tested, release_commit: context.sha, source_tree: current.tree.sha,
              branch: base, prerelease: false, workflows: runs}, null, 2) + '\n');
            core.setOutput('package_run', String(runs['package.yml'].id));
      - name: Download already qualified package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ steps.qualification.outputs.package_run }}
        run: gh run download "$PACKAGE_RUN" --name installed-package-3.12 --dir stable-download
      - name: Download the qualified candidate wheel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          read -r schema tag artifact candidate < <(python - <<'PY'
          import json, os
          q = json.load(open(f"docs/releases/{os.environ['VERSION']}-qualification.json"))
          c = q.get('candidate') or {}
          print(q.get('schema'), c.get('tag') or '-', c.get('package_artifact') or '-', c.get('version') or '-')
          PY
          )
          if [ "$schema" != 2 ]; then
            echo "Schema $schema manifest: no candidate wheel to download"
            exit 0
          fi
          wheel="atraxis-$candidate-py3-none-any.whl"
          mkdir candidate-download
          if [ "$tag" != - ]; then
            gh release download "$tag" --pattern "$wheel" --dir candidate-download
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > candidate-artifact.zip
            unzip -p candidate-artifact.zip "dist/$wheel" > "candidate-download/$wheel"
          fi
          # prepare-stable-release.py checks this wheel against the reviewed manifest.
      - name: Verify package identity and stage exact archives
        run: python scripts/prepare-stable-release.py
      - name: Publish draft only after every asset is attached
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = context.repo;
            const candidate = JSON.parse(fs.readFileSync('stable-assets/release-provenance.json'));
            const tag = 'v' + candidate.version;
            for (const lookup of [
              () => github.rest.repos.getReleaseByTag({...repo, tag}),
              () => github.rest.git.getRef({...repo, ref: 'tags/' + tag})]) {
              try { await lookup(); } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error('Existing release/tag must not be overwritten');
            }
            const body = fs.readFileSync(`docs/releases/${candidate.version}.md`, 'utf8');
            const release = (await github.rest.repos.createRelease({...repo,
              tag_name: tag, target_commitish: context.sha, name: `Atraxis ${candidate.version}`,
              body, draft: true, prerelease: false, make_latest: 'false'})).data;
            for (const name of fs.readdirSync('stable-assets').sort()) {
              const data = fs.readFileSync(path.join('stable-assets', name));
              await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id,
                name, data, headers: {'content-type': 'application/octet-stream',
                  'content-length': data.length}});
            }
            const published = (await github.rest.repos.updateRelease({...repo,
              release_id: release.id, draft: false, prerelease: false, make_latest: 'true'})).data;
            await core.summary.addLink('Published stable release', published.html_url).write();
