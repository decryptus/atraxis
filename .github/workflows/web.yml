name: Web inventory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install HTTPdis native dependency
        timeout-minutes: 3
        run: |
          sed -i 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g; s|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update
          apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install --yes --no-install-recommends libmagic1t64
      - run: python -m pip install . playwright==1.55.0
      - run: python scripts/check_web_browser.py
      - run: python scripts/check_configuration_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-inventory-synthetic
          path: web-browser-artifacts/*.png
          retention-days: 7
