[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atraxis"
version = "1.0.1"
description = "Supervision and operator interfaces for authorized infrastructure workflows"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
requires-python = ">=3.11,<3.13"
dependencies = ["dwho==0.3.66", "httpdis==0.6.34", "sonicprobe==0.3.62", "PyYAML==6.0.3"]

[project.optional-dependencies]
installer = ["cryptography==50.0.2"]
textual = ["dwho[textual]==0.3.66"]
rules = ["atropos-client[observations]==1.0.0"]

[project.scripts]
atraxis = "atraxis.cli:main"

[tool.setuptools.packages.find]
include = ["atraxis*"]
